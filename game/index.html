<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOLDEN TIDE — a sun-soaked open-world crime game in Palmera</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ffd34d'/%3E%3C/svg%3E">
<style>
  /* GOLDEN TIDE — index.html: one job, the page shell. Full-window dark stage,
     a 1280x720 canvas centred, nothing loaded from the network. */
  html, body { margin: 0; padding: 0; height: 100%; background: #17100a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    display: block; background: #8fae5a; cursor: crosshair;
    box-shadow: 0 0 60px rgba(255, 170, 60, 0.25);
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
